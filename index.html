<!DOCTYPE html>
<html lang="id" class="dark scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alif Cimol Store - Top Up & Marketplace Akun Game Terpercaya</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',300:'#c4b5fd',400:'#a78bfa',500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',800:'#5b21b6',900:'#4c1d95',950:'#2e1065'},darkbg:'#080b14',cardbg:'#111728'},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Lucide dikunci versinya. Kalau gagal dimuat, halaman tetap jalan tanpa ikon -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#080b14;color:#f3f4f6}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#080b14}::-webkit-scrollbar-thumb{background:#4c1d95;border-radius:9999px}
.glow{box-shadow:0 0 25px -5px rgba(139,92,246,.4)}
.tglow{text-shadow:0 0 12px rgba(167,139,250,.6)}
@keyframes m{to{transform:translateX(-50%)}}
.marq{display:flex;width:max-content;animation:m 35s linear infinite}
.marq:hover{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.marq{animation:none}}
.inp{width:100%;background:#0b1020;border:1px solid rgba(139,92,246,.3);border-radius:.75rem;padding:.65rem .9rem;font-size:.875rem;color:#fff;outline:none}
.inp:focus{border-color:#a78bfa}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
</style>
</head>
<body class="min-h-screen flex flex-col selection:bg-brand-600">

<div id="toast" class="fixed top-20 right-4 z-[999] flex flex-col gap-2 max-w-xs w-full pointer-events-none"></div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 z-[90] bg-black/70 backdrop-blur-sm items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
  <div id="modal-body" class="bg-cardbg border border-brand-500/30 rounded-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5"></div>
</div>

<!-- HEADER -->
